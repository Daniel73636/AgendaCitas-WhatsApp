name: CI

on:
  pull_request:
  push:
    branches: [feat/mejora-produccion-ux, main]

concurrency:
  group: ci-agenda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-mvp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: full-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: full-mvp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        continue-on-error: true
